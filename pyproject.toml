[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertigo"
version = "0.0.0"
description = "Adversarial testing for stateful, tool-wielding LLM agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
vertigo = "vertigo.cli:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "mypy>=2.3.1,<3",
    "pip-audit>=2.9,<3",
    "poethepoet>=0.37,<1",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
    "setuptools>=83,<85",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lock-check = "uv lock --check --offline"
lint = "ruff check ."
typecheck = "mypy src tests"
test = "pytest"
build = "python -m build --no-isolation"
audit = "pip-audit"
check = ["lock-check", "format-check", "lint", "typecheck", "test", "build"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=vertigo --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vertigo"]

[tool.coverage.report]
show_missing = true
